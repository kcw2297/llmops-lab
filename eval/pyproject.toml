[project]
name = "ocr-eval"
version = "0.1.0"
description = "서빙 엔드포인트 부하·품질 측정"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "ocr-core",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
]

[tool.uv.sources]
ocr-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
