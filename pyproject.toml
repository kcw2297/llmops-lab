[project]
name = "ocr-model"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["ocr-core", "ocr-eval"]

# 모듈러 모놀리스: 멤버 = 모듈. 의존은 eval → ocr-core 한 방향만.
# 앱은 별도 Private 레포(ocr-agent)에 있고, OpenAI 호환 API로만 연결한다.
# serving/, finetune/ 은 RunPod 컨테이너에서 실행되므로 workspace 멤버가 아니다.
[tool.uv.workspace]
members = ["packages/ocr-core", "eval"]

[tool.uv.sources]
ocr-core = { workspace = true }
ocr-eval = { workspace = true }
