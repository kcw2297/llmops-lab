[project]
name = "llmops-lab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["llmops-core", "llmops-eval"]

# 모듈러 모놀리스: 멤버 = 모듈. 의존은 eval → llmops-core 한 방향만.
# 에이전트 앱은 별도 Private 레포(biz-automation)에 있고, OpenAI 호환 API로만 연결한다.
# serving/, finetune/ 은 RunPod 컨테이너에서 실행되므로 workspace 멤버가 아니다.
[tool.uv.workspace]
members = ["packages/llmops-core", "eval"]

[tool.uv.sources]
llmops-core = { workspace = true }
llmops-eval = { workspace = true }
