version = 1
revision = 3
requires-python = ">=3.13"

[manifest]
members = [
    "ocr-core",
    "ocr-eval",
    "ocr-model",
]

[[package]]
name = "ocr-core"
version = "0.1.0"
source = { editable = "packages/ocr-core" }

[[package]]
name = "ocr-eval"
version = "0.1.0"
source = { editable = "eval" }
dependencies = [
    { name = "ocr-core" },
]

[package.metadata]
requires-dist = [{ name = "ocr-core", editable = "packages/ocr-core" }]

[[package]]
name = "ocr-model"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "ocr-core" },
    { name = "ocr-eval" },
]

[package.metadata]
requires-dist = [
    { name = "ocr-core", editable = "packages/ocr-core" },
    { name = "ocr-eval", editable = "eval" },
]
